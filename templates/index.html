<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文思 Agent · 专精中文写作</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b3541e' d='M12 3l1.8 5.6L19.5 10l-5.7 1.4L12 17l-1.8-5.6L4.5 10l5.7-1.4z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf7f2;
    --card: #ffffff;
    --ink: #2b2b28;
    --ink-soft: #6b675e;
    --line: #e5ded2;
    --accent: #b3541e;
    --accent-deep: #8a3f14;
    --accent-soft: #f3e6d8;
    --ok: #4a7c59;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand { font-family: "Noto Serif SC", serif; font-size: 20px; font-weight: 700; }
  .brand em { font-style: normal; color: var(--accent); }
  .brand small { font-family: "Noto Sans SC", sans-serif; font-size: 12px; color: var(--ink-soft); margin-left: 8px; font-weight: 400; }
  .modes { display: flex; gap: 8px; }
  .modes button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: all .15s;
  }
  .modes button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modes button:not(.active):hover { border-color: var(--accent); color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .empty { text-align: center; color: var(--ink-soft); padding: 60px 16px; }
  .empty .seal { font-family: "Noto Serif SC", serif; font-size: 42px; color: var(--accent); opacity: .85; }
  .empty h2 { font-family: "Noto Serif SC", serif; font-size: 20px; margin: 14px 0 6px; color: var(--ink); }
  .empty p { font-size: 13px; line-height: 1.8; }
  .empty .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .empty .examples button {
    border: 1px dashed var(--line); background: var(--card); color: var(--ink-soft);
    padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 12.5px; font-family: inherit;
  }
  .empty .examples button:hover { border-color: var(--accent); color: var(--accent); }
  .msg { display: flex; gap: 10px; }
  .msg .role {
    flex: 0 0 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Serif SC", serif; font-size: 16px; color: #fff; background: var(--ink);
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .role { background: var(--accent); }
  .msg .bubble {
    max-width: 78%; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; font-size: 14.5px; line-height: 1.85;
    font-family: "Noto Serif SC", "Noto Sans SC", serif;
  }
  .msg.user .bubble { background: var(--accent-soft); border-color: transparent; }
  .msg .bubble pre {
    background: #f4f0e8; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: 13px; line-height: 1.7;
    font-family: "Noto Sans SC", monospace; white-space: pre-wrap; word-break: break-all;
  }
  .msg .bubble code { background: #f4f0e8; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .msg .bubble pre code { background: none; padding: 0; }
  .msg .bubble h1, .msg .bubble h2, .msg .bubble h3 {
    font-family: "Noto Serif SC", serif; margin: 10px 0 6px; line-height: 1.4;
  }
  .msg .bubble h1 { font-size: 18px; } .msg .bubble h2 { font-size: 16.5px; } .msg .bubble h3 { font-size: 15px; }
  .msg .bubble ul, .msg .bubble ol { padding-left: 22px; }
  .msg .bubble li { margin: 3px 0; }
  .msg .bubble hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .msg .bubble strong { font-weight: 700; }
  .msg .bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
  .msg .bubble th, .msg .bubble td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .msg .bubble th { background: #f4f0e8; }
  .typing { color: var(--ink-soft); font-size: 13px; padding: 4px 2px; }
  .typing::after { content: "…"; animation: dots 1.2s infinite; }
  @keyframes dots { 0% { content: ""; } 33% { content: "。"; } 66% { content: "。。"; } }
  footer {
    background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px 16px;
  }
  .inputbox { max-width: 860px; margin: 0 auto; }
  .tools-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .tools-row button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-family: inherit;
  }
  .tools-row button:hover { border-color: var(--accent); color: var(--accent); }
  #status { font-size: 12px; color: var(--ink-soft); }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 52px; max-height: 160px;
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    font-family: inherit; font-size: 14.5px; line-height: 1.6; color: var(--ink);
    background: var(--paper);
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  #send {
    border: none; background: var(--accent); color: #fff; padding: 12px 22px;
    border-radius: 12px; cursor: pointer; font-size: 14.5px; font-family: inherit; font-weight: 500;
  }
  #send:hover { background: var(--accent-deep); }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(43,43,40,.4);
    display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--card); border-radius: 16px; width: 100%; max-width: 520px;
    padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.15);
  }
  .modal h3 { font-family: "Noto Serif SC", serif; font-size: 17px; margin-bottom: 12px; }
  .modal .close { float: right; border: none; background: none; font-size: 20px; cursor: pointer; color: var(--ink-soft); }
  .modal .note-list { max-height: 240px; overflow-y: auto; margin-bottom: 14px; }
  .modal .note-item {
    display: flex; justify-content: space-between; gap: 10px;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
    font-size: 13px; line-height: 1.6;
  }
  .modal .note-item b { color: var(--accent); white-space: nowrap; }
  .modal form { display: flex; gap: 8px; flex-wrap: wrap; }
  .modal form input {
    flex: 1; min-width: 120px; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-family: inherit; font-size: 13px;
  }
  .modal form button {
    border: none; background: var(--accent); color: #fff; border-radius: 8px;
    padding: 8px 16px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 13px; display: none; z-index: 30; max-width: 86%;
  }
  @media (max-width: 640px) {
    .brand small { display: none; }
    .modes button { padding: 5px 10px; font-size: 12px; }
    main { padding: 16px 10px; }
    .msg .bubble { max-width: 86%; font-size: 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><em>文思</em> Agent <small>专精中文写作 · 小说 / 文案 / 文档</small></div>
  <nav class="modes" id="modes">
    <button data-mode="novel" class="active">小说家</button>
    <button data-mode="copy">文案师</button>
    <button data-mode="doc">文书官</button>
  </nav>
</header>

<main id="main">
  <div class="wrap" id="chat"></div>
  <div class="wrap" id="empty">
    <div class="empty">
      <div class="seal">文</div>
      <h2>你好，我是文思</h2>
      <p>选一个写作模式，把你的需求直接告诉我。<br>从题材到分章大纲、正文与润色，一气呵成；成品自动落盘到 storage 目录。</p>
      <div class="examples">
        <button data-ex="写一个校园悬疑小说，主角是转学生，20章，章末留钩子">校园悬疑小说 · 20章</button>
        <button data-ex="为一款降噪耳机写5条小红书种草文案，目标人群是通勤上班族">降噪耳机 · 小红书文案</button>
        <button data-ex="写一份Q3部门工作总结，包含数据成效和下一步计划">季度工作总结</button>
        <button data-ex="把这段文字润色得更精炼有力：今天天气很好，我们出去玩很开心">润色一段文字</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="inputbox">
    <div class="tools-row">
      <button id="btnNotes">设定管理</button>
      <span id="status"></span>
    </div>
    <div class="input-row">
      <textarea id="input" placeholder="输入你的创作需求，例如：写一个武侠小说，主角是孤儿，40章…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send">发送</button>
    </div>
  </div>
</footer>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <button class="close" id="modalClose">&times;</button>
    <h3>设定管理</h3>
    <div class="note-list" id="noteList"></div>
    <form id="noteForm">
      <input id="noteKey" placeholder="键，如：主角">
      <input id="noteValue" placeholder="值，如：林晚，26岁，考古系研究生">
      <button type="submit">记录</button>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const state = { mode: "novel", messages: [], busy: false };

const MODE_LABEL = { novel: "小说家", copy: "文案师", doc: "文书官" };

/* ---------- 轻量 Markdown 渲染 ---------- */
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function renderMd(md) {
  const lines = md.split("\n");
  let html = "", i = 0, inCode = false, codeBuf = [];
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim().startsWith("```")) {
      if (!inCode) { inCode = true; codeBuf = []; }
      else { html += "<pre><code>" + escapeHtml(codeBuf.join("\n")) + "</code></pre>"; inCode = false; }
      i++; continue;
    }
    if (inCode) { codeBuf.push(line); i++; continue; }
    if (/^#{1,3}\s/.test(line)) {
      const level = line.match(/^#{1,3}/)[0].length;
      html += `<h${level}>${inline(line.replace(/^#{1,3}\s/, ""))}</h${level}>`;
    } else if (/^-{3,}$/.test(line.trim())) {
      html += "<hr>";
    } else if (/^\s*[-*]\s/.test(line)) {
      html += "<ul>";
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) {
        html += "<li>" + inline(lines[i].replace(/^\s*[-*]\s/, "")) + "</li>";
        i++;
      }
      html += "</ul>"; i--; continue;
    } else if (/^\s*\d+[.、]\s/.test(line)) {
      html += "<ol>";
      while (i < lines.length && /^\s*\d+[.、]\s/.test(lines[i])) {
        html += "<li>" + inline(lines[i].replace(/^\s*\d+[.、]\s/, "")) + "</li>";
        i++;
      }
      html += "</ol>"; i--; continue;
    } else if (/^\|.*\|$/.test(line.trim())) {
      html += "<table>";
      while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) {
        const cells = lines[i].trim().slice(1, -1).split("|").map(c => inline(c.trim()));
        html += "<tr>" + cells.map(c => `<td>${c}</td>`).join("") + "</tr>";
        i++;
      }
      html += "</table>"; i--; continue;
    } else if (line.trim() === "") {
      html += "<br>";
    } else {
      html += `<p>${inline(line)}</p>`;
    }
    i++;
  }
  return html;
}
function inline(s) {
  let t = escapeHtml(s);
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return t;
}

/* ---------- 界面 ---------- */
const chat = document.getElementById("chat");
const empty = document.getElementById("empty");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

function showEmpty(v) { empty.style.display = v ? "" : "none"; }

function addMessage(role, content) {
  showEmpty(false);
  const div = document.createElement("div");
  div.className = "msg " + role;
  const roleName = role === "user" ? "你" : "文";
  div.innerHTML = `<div class="role">${roleName}</div><div class="bubble">${role === "user" ? escapeHtml(content) : renderMd(content)}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function switchMode(mode) {
  state.mode = mode;
  state.messages = [];
  chat.innerHTML = "";
  showEmpty(true);
  document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  setStatus("已切换到「" + MODE_LABEL[mode] + "」模式");
}

function setStatus(text) { statusEl.textContent = text || ""; }

function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 2600);
}

async function send() {
  const text = input.value.trim();
  if (!text || state.busy) return;
  input.value = "";
  addMessage("user", text);
  state.messages.push({ role: "user", content: text });
  state.busy = true;
  sendBtn.disabled = true;
  const typing = addMessage("assistant", "");
  typing.querySelector(".bubble").classList.add("typing");
  typing.querySelector(".bubble").textContent = "文思正在构思";
  setStatus("写作中…");
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: state.mode, messages: state.messages }),
    });
    const data = await resp.json();
    typing.remove();
    if (data.error) {
      toast(data.error);
      setStatus("");
    } else {
      state.messages = data.messages;
      addMessage("assistant", data.reply);
      setStatus("已完成");
    }
  } catch (e) {
    typing.remove();
    toast("网络请求失败：" + e.message);
    setStatus("");
  } finally {
    state.busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

/* ---------- 设定管理 ---------- */
async function openNotes() {
  document.getElementById("modalMask").classList.add("show");
  try {
    const resp = await fetch("/api/notes?mode=" + state.mode);
    const data = await resp.json();
    const list = document.getElementById("noteList");
    list.innerHTML = "";
    const entries = Object.entries(data);
    if (!entries.length) list.innerHTML = '<p style="color:var(--ink-soft);font-size:13px">暂无设定，下方添加。</p>';
    entries.forEach(([k, v]) => {
      const item = document.createElement("div");
      item.className = "note-item";
      item.innerHTML = `<span><b>${escapeHtml(k)}</b>　${escapeHtml(v)}</span>`;
      list.appendChild(item);
    });
  } catch (e) {
    toast("读取设定失败");
  }
}
document.getElementById("btnNotes").onclick = openNotes;
document.getElementById("modalClose").onclick = () => document.getElementById("modalMask").classList.remove("show");
document.getElementById("modalMask").onclick = (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove("show"); };
document.getElementById("noteForm").onsubmit = async (e) => {
  e.preventDefault();
  const key = document.getElementById("noteKey").value.trim();
  const value = document.getElementById("noteValue").value.trim();
  if (!key || !value) return;
  try {
    const resp = await fetch("/api/set", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: state.mode, key, value }),
    });
    const data = await resp.json();
    if (data.ok) { toast("设定已记录"); document.getElementById("noteKey").value = ""; document.getElementById("noteValue").value = ""; openNotes(); }
    else toast(data.error || "写入失败");
  } catch (e) { toast("写入失败"); }
};

/* ---------- 事件绑定 ---------- */
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => switchMode(b.dataset.mode));
document.querySelectorAll(".examples button").forEach(b => b.onclick = () => { input.value = b.dataset.ex; input.focus(); });
sendBtn.onclick = send;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
